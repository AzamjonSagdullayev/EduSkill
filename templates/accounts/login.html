{% extends 'base.html' %}
{% block title %}Kirish{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="8" fill="#6366f1"/>
                <path d="M8 22L16 10L24 22H8Z" fill="white" opacity="0.9"/>
                <circle cx="16" cy="14" r="3" fill="white"/>
            </svg>
            <h1>EduSkill</h1>
            <p>Hisobingizga kiring</p>
        </div>

        <form method="post" class="auth-form" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Foydalanuvchi nomi yoki Email</label>
                <input type="text" id="id_username" name="username" class="form-input"
                       placeholder="username yoki email@example.com" required autofocus
                       value="{{ request.POST.username|default:'' }}">
            </div>
            <div class="form-group">
                <label for="id_password">Parol</label>
                <div class="input-password-wrapper">
                    <input type="password" id="id_password" name="password" class="form-input"
                           placeholder="Parolingiz" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('id_password', this)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Kirish</button>
        </form>

        <p class="auth-footer">
            Hisobingiz yo'qmi? <a href="{% url 'accounts:register' %}">Ro'yxatdan o'ting</a>
        </p>
    </div>
</div>
{% endblock %}
